# Contextive Community definitions (format v1) — the consumer-fixture glossary corpus.
#
# Landing THIS file is the atomic on-switch for the whole glossary seam: the
# toolkit's integration is presence-gated on `.contextive/definitions.yaml`, so
# until this file exists the fixture is byte-identical to a glossary-free site.
#
# Trimmed to the single `rhetoric` context (the example's `shipping`/`hr`
# contexts are dropped — the fixture ships only the rhetoric showcase slice).
# Pages regenerate at build under `docs/glossary/**` (gitignored).
contexts:
  - name: rhetoric
    domainVisionStatement: The art of finding the available means of persuasion.
    terms:
      - name: Deliberative rhetoric
        definition: |-
          The art of speaking on things that will (or should) happen in the future.
          This is a specific form of rhetoric, usually aimed at convincing a group
          of people to take a certain course of action.
        aliases:
          - political oratory
          - legislative rhetoric
      - name: Dialectic
        definition: |-
          The art of investigating or discussing the truth of opinions. It is a
          method of argument, using logical reasoning and questioning, that has
          been the foundation of future scientific and legal methods.
      - name: Dicast
        definition: |-
          A member of a jury in ancient Athens. The dicasts were selected by lot,
          and were paid for their service. The term is used to indicate someone who
          holds a formal position, and is asked to render judgement on a (legal)
          matter. The modern term "judge" is used in the text to indicate someone
          who forms an opinion on a matter, without the connotation of them being
          in a formal position of power.
      - name: Enthymeme
        definition: |-
          A form of syllogism, where one of the premises is not stated, but is
          implied. This is a form of argumentation that is often used in rhetoric,
          as the speaker can rely on the audience to fill in the missing premise.
          This makes the argument more persuasive, provided the audience has
          sufficient knowledge to fill in the gaps.
      - name: Epideictic rhetoric
        definition: |-
          The art of speaking on things that are happening in the present (or have
          happened very recently). This is a specific form of rhetoric, usually
          intended to speak about the virtues of a person, or their
          accomplishments. In modern times, we would call this "public relations"
          or "marketing".
        aliases:
          - ceremonial oratory
      - name: Forensic rhetoric
        definition: |-
          The art of speaking on things that have happened in the past. This is a
          specific form of rhetoric, usually aimed at convincing a judge or jury of
          the truth of a matter.
        aliases:
          - forensic oratory
          - judicial rhetoric
      - name: Induction
        definition: |-
          A form of reasoning that starts from specific observations, and then
          makes a generalization. This is the opposite of deduction, which starts
          from a generalization and then makes a specific conclusion. Induction is
          often used in scientific reasoning, as it is a way to form a hypothesis
          based on empirical evidence.
      - name: Orator
        definition: |-
          Someone who speaks publicly, either to a crowd, a general assembly, or in
          a court of law. The term "orator" is mostly used for those skilled in the
          art of persuasion, but in essence, it refers to anyone who speaks on
          formal occasions.
        aliases:
          - rhetorician
      - name: Sophist
        definition: |-
          A paid teacher of philosophy, rhetoric, and science in the ancient
          Hellenistic world. Sophists are associated with teaching others how to
          argue and live a virtuous life, and how to be a good citizen. They were
          often criticized for their relativistic views on truth and morality, and
          for "having their heads in the clouds".
      - name: Syllogism
        definition: |-
          A form of reasoning aimed at drawing a conclusion from two propositions
          that share a common subject. The conclusion is valid if both of the
          propositions are accurate. This is a rudimentary form of logical
          reasoning, stating `A & B -> C` where `A` and `B` are premises, and `C`
          is the conclusion. Modern logical theory teaches us to interpret this as:
          "either `C` is true, or `A & B` is false", which is slightly different to
          the classical interpretation of the form.
        examples:
          - All men are mortal. Socrates is a man. Therefore, Socrates is mortal.
          - >-
            All dogs are animals. All animals have four legs. Therefore, all dogs
            have four legs. (In this example, the second premise is incorrect, as
            there are animals with less than four legs.)
