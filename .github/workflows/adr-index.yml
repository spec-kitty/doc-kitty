# Regenerate the ADR index table after merge (ADR-0072, decision 2).
#
# docs/adr/README.md carries a table generated from the ADR files. Every PR that
# added an ADR used to add a row to it, so parallel PRs conflicted on the same
# lines. Now a PR only adds its ADR (CI checks that no two ADRs share a number),
# and this workflow regenerates the table on main and proposes it as ONE bot PR
# on the `ci/adr-index` branch, force-updated on every run, so there is never
# more than one.
#
# Two GitHub rules shape the steps:
#   - A branch or PR made with GITHUB_TOKEN starts no workflow, so the bot PR
#     would never get the required `ci-ok`. A `workflow_dispatch` is the
#     exception: the bot dispatches ci.yml on the branch, and that run's `ci-ok`
#     lands on the commit the PR shows.
#   - This repository may not let Actions create pull requests. Opening the PR
#     is then refused: the branch is still pushed, and the run summary links
#     the compare page, which opens the PR in one click.
# When the table is already current, a leftover `ci/adr-index` branch is
# deleted, which closes its PR. Nothing here pushes to main. The branch is the
# bot's alone: every run rebuilds it from main and force-pushes it, so a commit
# pushed to it by hand is lost.
name: ADR index

on:
  push:
    branches: [main]
    paths:
      - 'docs/adr/**'
  workflow_dispatch:

# Push the bot branch (contents), open its PR (pull-requests), dispatch CI on it (actions).
permissions:
  contents: write
  pull-requests: write
  actions: write

# One run at a time; a newer merge supersedes an older run.
concurrency:
  group: adr-index
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    env:
      BRANCH: ci/adr-index
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Enable corepack
        run: corepack enable
      - name: Set up Node 22 + pnpm cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Regenerate the ADR index
        id: regen
        run: |
          node src/scripts/generate-adr-index.mjs
          if git diff --quiet -- docs/adr/README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Close a stale bot branch
        if: steps.regen.outputs.changed == 'false'
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            git push origin --delete "$BRANCH"
            echo "The ADR index is current on main; deleted \`$BRANCH\`, which closes its PR." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The ADR index is current on main; nothing to do." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Push the regenerated table to the bot branch
        if: steps.regen.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/adr/README.md
          git commit -m "docs(adr): regenerate the ADR index" \
            -m "Regenerated by the ADR index workflow (run ${{ github.run_id }}) from main at $(git rev-parse HEAD)."
          git push --force origin "HEAD:refs/heads/$BRANCH"

      - name: Run CI on the bot branch
        if: steps.regen.outputs.changed == 'true'
        run: gh workflow run ci.yml --ref "$BRANCH"

      - name: Open the bot PR, or link it
        if: steps.regen.outputs.changed == 'true'
        run: |
          TITLE="docs(adr): regenerate the ADR index"
          BODY="Regenerates the ADR index table in docs/adr/README.md from the ADR files on main (ADR-0072). Produced by the ADR index workflow, run ${{ github.run_id }}. CI was dispatched on this branch, so ci-ok shows on its head."
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -n "$EXISTING" ]; then
            echo "Updated the open ADR index PR: $EXISTING" >> "$GITHUB_STEP_SUMMARY"
          elif URL=$(gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" --title "$TITLE" --body "$BODY" 2> "$RUNNER_TEMP/pr-create.err"); then
            echo "Opened the ADR index PR: $URL" >> "$GITHUB_STEP_SUMMARY"
          elif grep -qi "not permitted to create or approve pull requests" "$RUNNER_TEMP/pr-create.err"; then
            COMPARE="${{ github.server_url }}/${{ github.repository }}/compare/${{ github.event.repository.default_branch }}...$BRANCH?expand=1"
            echo "::warning::GitHub Actions may not open pull requests here. The table is on $BRANCH; open the PR from the run summary."
            echo "The regenerated table is on \`$BRANCH\`. [Open the pull request]($COMPARE)." >> "$GITHUB_STEP_SUMMARY"
          else
            # Any other failure (auth, network, a bad base) is a real error: do not hide it behind the compare link.
            cat "$RUNNER_TEMP/pr-create.err" >&2
            exit 1
          fi
