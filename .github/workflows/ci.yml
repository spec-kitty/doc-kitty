# Path-scoped CI — detect-changes → 4 conditional lanes → ci-ok gate.
#
# Design: docs/architecture/ci-cd-pipeline.md; contracts under
# kitty-specs/ci-cd-pipeline-01M0N1DZ/contracts/. The single required status check
# is `ci-ok` (branch protection; documented by WP07). Everything else is a lane
# that may skip — a skipped lane must never leave the required check pending.
#
# Fork-safety (FR-020): triggers on `pull_request` (NEVER pull_request_target) so
# fork code never gains secret access; these lanes need no secrets. Least-privilege
# top-level permissions; deploy/nightly live in separate workflows.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: read the repo, nothing more. Fork PRs pass with no secrets.
permissions:
  contents: read
  pull-requests: read # dorny/paths-filter lists a PR's changed files via the API

# At most one in-progress run per ref; supersede older runs (NFR-006).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Classifier: always runs, never trigger-path-filtered (C-006). ----------
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      workflows: ${{ steps.derive.outputs.workflows }}
      code: ${{ steps.derive.outputs.code }}
      example_content: ${{ steps.derive.outputs.example_content }}
      repo_docs: ${{ steps.derive.outputs.repo_docs }}
      ignored: ${{ steps.derive.outputs.ignored }}
      run_code_quality: ${{ steps.derive.outputs.run_code_quality }}
      run_doc_sanity: ${{ steps.derive.outputs.run_doc_sanity }}
      run_build_example: ${{ steps.derive.outputs.run_build_example }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Multi-match path filter over the single source of globs (.github/filters.yml).
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/filters.yml

      # Collapse multi-match → first-match primary group and derive run_* signals.
      # The precedence logic lives in the committed, unit-tested helper — not here.
      - name: Derive change groups
        id: derive
        env:
          FILTER_WORKFLOWS: ${{ steps.filter.outputs.workflows }}
          FILTER_CODE: ${{ steps.filter.outputs.code }}
          FILTER_EXAMPLE_CONTENT: ${{ steps.filter.outputs.example_content }}
          FILTER_REPO_DOCS: ${{ steps.filter.outputs.repo_docs }}
          FILTER_IGNORED: ${{ steps.filter.outputs.ignored }}
        run: node .github/scripts/derive-change-groups.mjs

  # --- Lane: code-quality (code || workflows). --------------------------------
  code-quality:
    needs: detect-changes
    if: needs.detect-changes.outputs.run_code_quality == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Enable corepack
        run: corepack enable
      - name: Set up Node 22 + pnpm cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test

  # --- Lane: doc-sanity (code || example_content || repo_docs || workflows). ---
  # BUILD-FREE: static validators only, no `astro build` (NFR-002).
  doc-sanity:
    needs: detect-changes
    if: needs.detect-changes.outputs.run_doc_sanity == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Enable corepack
        run: corepack enable
      - name: Set up Node 22 + pnpm cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Validate frontmatter (docs)
        run: pnpm validate:docs
      - name: Validate frontmatter (example/docs)
        run: pnpm validate:example
      - name: Resolve internal links & related refs
        run: pnpm validate:links
      - name: Markdownlint (docs + example/docs)
        run: pnpm exec markdownlint-cli2 "docs/**/*.md" "example/docs/**/*.md"
      # Vale prose stylecheck. Install the pinned binary and run it directly so the
      # gate checks ALL files at error severity (per .vale.ini) on both push and PR.
      # (The reviewdog-based vale-action uses filter_mode: added, which needs a PR
      # diff and errors on push with "diff command is empty".) Needs no token, so
      # fork PRs pass.
      - name: Install Vale
        run: |
          VALE_VERSION=3.18.0
          curl -sSfL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" -o /tmp/vale.tgz
          sudo tar -xzf /tmp/vale.tgz -C /usr/local/bin vale
          vale --version
      - name: Vale prose stylecheck
        run: vale --minAlertLevel=error docs example/docs

  # --- Lane: build-example (code || example_content || workflows). -------------
  build-example:
    needs: detect-changes
    if: needs.detect-changes.outputs.run_build_example == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Shared build definition (WP03 composite; also reused by WP05 deploy).
      - name: Build example site
        uses: ./.github/actions/build-example
      # Artifact assertions run HERE (not in the composite) so the PR gate asserts
      # while deploy reuses the pure build (contracts/build-example-action.contract.md).
      - name: Assert build artifacts
        run: pnpm assert:artifacts example/dist
      # Additive (WP09): publish the built dist so the a11y lane CONSUMES it rather
      # than rebuilding (path-efficiency). This adds no assertion and does not change
      # this lane's pass/fail semantics.
      - name: Upload built dist for the a11y lane
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: example-dist
          path: example/dist
          retention-days: 1
          include-hidden-files: true

  # --- Lane: a11y (WP09) — axe-core + visual, both modes, on the built dist. ----
  # Runs whenever build-example runs (same change surface: it consumes that lane's
  # dist artifact instead of rebuilding). Executes inside the PINNED Playwright
  # container so the visual baselines are reproducible bit-for-bit (T041). The only
  # browser download is the explicit, Chromium-only `playwright install` step below
  # (deny-by-default lifecycle discipline, DIRECTIVE_051 / NFR-005).
  a11y:
    needs: [detect-changes, build-example]
    if: needs.detect-changes.outputs.run_build_example == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Enable corepack
        run: corepack enable
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # Consume the build-example artifact rather than rebuilding (path-efficiency).
      - name: Download built dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: example-dist
          path: example/dist
      # The ONE allowlisted browser download — Chromium only, explicit (never a
      # silent postinstall). A no-op verify in the pinned image, kept for discipline.
      - name: Install Chromium (explicit, allowlisted)
        run: npx playwright install --with-deps chromium
      - name: Run accessibility + visual lane
        run: pnpm test:a11y

  # --- Gate: ci-ok — the single required status check (FR-012, C-005). --------
  # Job id MUST stay exactly `ci-ok` (branch protection references this string).
  # All FOUR lanes (code-quality, doc-sanity, build-example, a11y) are gated by the
  # ONE decision helper — issue #7. There is deliberately no second inline gate here:
  # `REQUIRED_LANES` in .github/scripts/ci-ok-decision.mjs is the single source of
  # truth for what ci-ok enforces, and a lane whose `*_RESULT` is not threaded in
  # below reads as `undefined` and fails the gate closed.
  ci-ok:
    needs: [detect-changes, code-quality, doc-sanity, build-example, a11y]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Explicit result evaluation via the committed, unit-tested helper. NOT a bare
      # `always() + exit 0`: this exits non-zero on any lane failure/cancellation or
      # a detect-changes that is not `success` (no all-skip false green).
      - name: Evaluate ci-ok
        env:
          DETECT_CHANGES_RESULT: ${{ needs.detect-changes.result }}
          CODE_QUALITY_RESULT: ${{ needs.code-quality.result }}
          DOC_SANITY_RESULT: ${{ needs.doc-sanity.result }}
          BUILD_EXAMPLE_RESULT: ${{ needs.build-example.result }}
          A11Y_RESULT: ${{ needs.a11y.result }}
        run: node .github/scripts/ci-ok-decision.mjs
