# Shared "build the example docsite" composite action.
#
# This is the SINGLE build definition (spec.md "Build definition" entity) reused
# by both the WP04 build-example CI job and the WP05 deploy job, so that what the
# PR gate builds is what gets published (FR-015).
#
# Draft publication (sidebar-frame-header-carrier WP05): this action does NOT set
# DK_PUBLISH_DRAFTS. Like the diagram build-render settings it is JOB-level, so
# each caller states it: ci.yml's build-example job sets `on` (its gates cover
# draft pages) and deploy.yml sets `off` (the live site publishes no drafts). A
# caller that sets nothing gets the toolkit default, which is `on`: its build
# contains the draft pages.
#
# Scope boundary (contracts/build-example-action.contract.md):
#   - PURE BUILD. It does NOT run artifact assertions. `pnpm assert:artifacts`
#     runs as a separate step in the WP04 build-example job, AFTER this action —
#     so the PR gate asserts while deploy (WP05) reuses the build without
#     inheriting the PR-gate assertion (a legitimate content-count change must
#     not fail the mainline publish).
#   - It does NOT self-checkout. Composite actions cannot; the caller MUST run
#     `actions/checkout` before `uses: ./.github/actions/build-example`.
#
# Consumers: WP04 build-example job, WP05 deploy job.
name: Build example docsite
description: >-
  Enable corepack, set up Node + pnpm cache, install with a frozen lockfile, and
  run the shared `pnpm build`. Pure build; runs no assertions and no checkout.

inputs:
  node-version:
    description: Node.js version to set up.
    required: false
    default: "22"
  working-directory:
    description: Directory to run the build from (repo root by default).
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Enable corepack
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: corepack enable

    # Pinned to a commit SHA (supply-chain hygiene). SHA = actions/setup-node@v4.4.0.
    - name: Set up Node ${{ inputs.node-version }} with pnpm cache
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install dependencies (frozen lockfile)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile

    # Build-render infra (#13 WP03 / FR-009). The diagram build-render stage renders
    # Mermaid through Playwright/Chromium (`@beoe/rehype-mermaid` → mermaid-isomorphic).
    # Install ONLY Chromium (allowlisted, explicit — never a silent postinstall), the
    # SAME browser+version the a11y lane's pinned container ships; the exact version is
    # governed by the workspace `@playwright/test@1.62.1` pin, so `npx playwright`
    # resolves that. `install-deps` needs sudo, which the bare-ubuntu build runner has.
    # The PlantUML server + the DK_DIAGRAM_BUILD_RENDER / DK_PLANTUML_SERVER_URL env are
    # JOB-level (a composite cannot declare `services:`), supplied by each caller job.
    # A build whose caller sets no build-render env still works: `resolveDiagramMode`
    # then auto-detects this Chromium and build-renders anyway (or falls back to client).
    #
    # The browser is cached, keyed on the resolved Playwright version (#117): one 403
    # from cdn.playwright.dev failed a mainline deploy, and Playwright's own retries
    # all fire within a few seconds. On a cache miss the download is retried with a
    # pause between attempts. The system libraries are not part of the cache, so
    # `install-deps` runs every time.
    - name: Resolve the Playwright version
      id: playwright
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    # Pinned to a commit SHA (supply-chain hygiene). SHA = actions/cache@v4.2.3.
    - name: Restore the Chromium download
      id: playwright-cache
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ~/.cache/ms-playwright
        key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

    - name: Install Chromium for build-render diagrams (allowlisted)
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        for attempt in 1 2 3; do
          if npx playwright install chromium; then exit 0; fi
          echo "Chromium download failed (attempt $attempt/3)" >&2
          if [ "$attempt" -lt 3 ]; then sleep $((attempt * 20)); fi
        done
        exit 1

    - name: Install Chromium system dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npx playwright install-deps chromium

    - name: Build the site
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm build
