# Shared "build the example docsite" composite action.
#
# This is the SINGLE build definition (spec.md "Build definition" entity) reused
# by both the WP04 build-example CI job and the WP05 deploy job, so that what the
# PR gate builds is exactly what gets published (FR-015).
#
# Scope boundary (contracts/build-example-action.contract.md):
#   - PURE BUILD. It does NOT run artifact assertions. `pnpm assert:artifacts`
#     runs as a separate step in the WP04 build-example job, AFTER this action —
#     so the PR gate asserts while deploy (WP05) reuses the build without
#     inheriting the PR-gate assertion (a legitimate content-count change must
#     not fail the mainline publish).
#   - It does NOT self-checkout. Composite actions cannot; the caller MUST run
#     `actions/checkout` before `uses: ./.github/actions/build-example`.
#
# Consumers: WP04 build-example job, WP05 deploy job.
name: Build example docsite
description: >-
  Enable corepack, set up Node + pnpm cache, install with a frozen lockfile, and
  run the shared `pnpm build`. Pure build; runs no assertions and no checkout.

inputs:
  node-version:
    description: Node.js version to set up.
    required: false
    default: "22"
  working-directory:
    description: Directory to run the build from (repo root by default).
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Enable corepack
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: corepack enable

    # Pinned to a commit SHA (supply-chain hygiene). SHA = actions/setup-node@v4.4.0.
    - name: Set up Node ${{ inputs.node-version }} with pnpm cache
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install dependencies (frozen lockfile)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile

    # Build-render infra (#13 WP03 / FR-009). The diagram build-render stage renders
    # Mermaid through Playwright/Chromium (`@beoe/rehype-mermaid` → mermaid-isomorphic).
    # Install ONLY Chromium (allowlisted, explicit — never a silent postinstall), the
    # SAME browser+version the a11y lane's pinned container ships; the exact version is
    # governed by the workspace `@playwright/test@1.62.1` pin, so `npx playwright`
    # resolves that. `--with-deps` needs sudo, which the bare-ubuntu build runner has.
    # The PlantUML server + the DK_DIAGRAM_BUILD_RENDER / DK_PLANTUML_SERVER_URL env are
    # JOB-level (a composite cannot declare `services:`), supplied by each caller job.
    # A build whose caller sets no build-render env still works: `resolveDiagramMode`
    # then auto-detects this Chromium and build-renders anyway (or falls back to client).
    - name: Install Chromium for build-render diagrams (allowlisted)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npx playwright install --with-deps chromium

    - name: Build the site
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm build
