# Vale configuration for the Common Docs — Kitty Variation.
#
# Deliberately minimal: gate only `error`-level findings so the prose check
# starts as a thin, high-signal net and grows over time (over-strict prose
# rules swamp PRs with noise). CI (WP04) runs `vale` over the docs trees.
StylesPath = .vale/styles

# Only errors fail the check; suggestions/warnings are not surfaced here.
MinAlertLevel = error

# Apply the in-repo DocKitty style to Markdown; frontmatter is ignored.
[*.{md,mdx}]
BasedOnStyles = DocKitty
