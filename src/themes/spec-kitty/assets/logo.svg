<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="doc-kitty mark">
  <!--
    doc-kitty's OWN header mark (WP04, T018/T019). Self-authored placeholder — a
    minimal document glyph with the brand's yellow-scalpel accent. NOT copied from
    spec-kitty-design; carries no external dependency. The site wordmark renders
    separately from Starlight's `title` config (brand.css styles it).
  -->
  <rect x="1" y="1" width="30" height="30" rx="8" fill="#181A1F" stroke="#2B313B" stroke-width="1"/>
  <rect x="9" y="8" width="14" height="16" rx="2.5" fill="#0D0E11" stroke="#353C48" stroke-width="1.25"/>
  <line x1="12" y1="13" x2="20" y2="13" stroke="#A9A9B0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="12" y1="16.5" x2="20" y2="16.5" stroke="#A9A9B0" stroke-width="1.5" stroke-linecap="round"/>
  <!-- the yellow accent: a bookmark tab, the brand's always-on signal -->
  <path d="M12 19.5 h8 v3.5 l-4 -2 l-4 2 z" fill="#F5C518"/>
</svg>
