openapi: 3.1.0
info:
  title: Parcels API
  version: 2.0.0-dev
  description: The unreleased fixture version. Its pages must be built but stay out of the sitemap and the search index (FR-015).
servers:
  - url: https://api.example.test/v2
paths:
  /parcels:
    get:
      operationId: listParcels
      summary: List parcels
      description: Returns every parcel the caller can see. Exists in both versions, so the version switcher (FR-017) deep-links this operation across versions.
      tags: [parcels]
      responses:
        '200':
          description: The parcels.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Parcel'
  /parcels/{parcelId}:
    get:
      operationId: getParcel
      summary: Get a parcel
      description: Present in v2 only.
      tags: [parcels]
      parameters:
        - name: parcelId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The parcel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parcel'
components:
  schemas:
    Parcel:
      type: object
      required: [id, recipient]
      properties:
        id:
          type: string
        recipient:
          type: string
