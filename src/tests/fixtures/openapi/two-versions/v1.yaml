openapi: 3.1.0
info:
  title: Parcels API
  version: 1.0.0
  description: The released fixture version. Its operation descriptions carry the three link kinds the build-time link check (FR-009) must see, namely a docs page, a fragment and an external URL.
servers:
  - url: https://api.example.test/v1
paths:
  /parcels:
    get:
      operationId: listParcels
      summary: List parcels
      description: |
        Returns every parcel the caller can see.

        See the [parcels guide](/guides/#parcels), the [guides section](/guides/) and the [external specification](https://example.test/spec).
      tags: [parcels]
      responses:
        '200':
          description: The parcels.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Parcel'
  /parcels/{parcelId}:
    delete:
      operationId: deleteParcel
      summary: Delete a parcel
      description: Present in v1 only, so the version switcher (FR-017) falls back to the target version's overview from this page.
      tags: [parcels]
      parameters:
        - name: parcelId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: The parcel is gone.
components:
  schemas:
    Parcel:
      type: object
      required: [id, recipient]
      properties:
        id:
          type: string
        recipient:
          type: string
