openapi: 3.1.0
info:
  title: Archive API
  version: 2.0.0
  description: Tagged-release file 3 of 3; the newest release, which a stable archive ordering (FR-023) lists after the older ones by code-point path order.
servers:
  - url: https://api.example.test/v2
paths:
  /parcels:
    get:
      operationId: listParcels
      summary: List parcels
      responses:
        '200':
          description: The parcels.
    post:
      operationId: createParcel
      summary: Create a parcel
      responses:
        '201':
          description: The parcel.
  /parcels/{parcelId}:
    get:
      operationId: getParcel
      summary: Get a parcel
      parameters:
        - name: parcelId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The parcel.
