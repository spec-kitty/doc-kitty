# Fictional example records. Not real companies or agreements.
#
# The sub-processor catalog (ADR-0086): one record per sub-processor. The build
# validates it and publishes api/subprocessors.json and the subprocessors.xml
# change feed; see "Sub-processor catalog" in docs/guides/consumer-setup.md.
# The three records show a current provider, an announced one (a future
# `since`) and a past one (`until`).
- id: northwind-hosting
  name: Northwind Hosting
  address: 1 Example Street, Amsterdam
  contact: privacy@northwind-hosting.example
  processing: Hosting of the production database and its backups.
  location: [NL, DE]
  location_note: Backups replicate to a second data centre in Frankfurt.
  responsibilities: Northwind operates the infrastructure; we configure access and retention.
  since: 2024-03-01
  external_references:
    - url: https://northwind-hosting.example/dpa
      title: Northwind Hosting data processing terms (fictional)
  tom_classification:
    - physical-security
    - measure: certification-assurance
      note: Yearly third-party audit of the hosting environment (fictional).
- id: fabrikam-mail
  name: Fabrikam Mail
  processing: Delivery of transactional email.
  location: [IE]
  responsibilities: Fabrikam delivers the mail; we decide what is sent and to whom.
