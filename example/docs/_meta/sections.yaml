# Authored section registry for the EXAMPLE docsite.
# Decouples display (label, order) from the on-disk folder layout: editing this
# file alone relabels or reorders a nav group — no content move, no theme edit
# (FR-013). Consumed by the Starlight sidebar and the discovery surfaces
# (llms.txt / RSS / agent API). Reserved, non-content: excluded from the docs
# collection. Schema and rules: docs/architecture/section-registry.md (ADR-0004).
#
# NOTE (issue #18): the glossary CONTENT folder stays `glossary/`; giving its
# registry entry `label: Reference` ships it under a named "Reference" nav group
# WITHOUT moving a single file. The `glossary-demo/` folder is intentionally NOT
# listed here — it exercises the loader's graceful coverage path, appearing as a
# humanized "Glossary Demo" group after the registered sections.
#
# `id` / `label` / `order` / `type` / `feeds` / `purpose` are all WIRED (issue
# #24; see src/lib/sections.ts's "WIRED / DEFERRED" note). `subtypes` (a
# per-section list of `{match, type}` sub-path rules) is ALSO wired
# (adopter-loader-migration-01M1KKYA WP01, E-02/FR-005) — consulted by
# `expectedDocType`/`expectedType` ahead of the built-in sub-path table, so a
# sub-path rename is a registry-DATA edit, not a derivation-code edit (SC-002;
# see the `plans` entry below).
version: 1
sections:
  - id: context
    label: Context
    order: 10
    type: Context

  - id: architecture
    label: Architecture
    order: 20
    type: Architecture

  - id: adr
    label: Decision Records
    order: 30
    type: ADR

  # WP04 (adopter-loader-migration-01M1KKYA #37/#48/#42): worked-example section
  # demonstrating FR-012/SC-001/SC-002. `plans/index.md` is the section index
  # (no README.md here) and `plans/missions/` was renamed from `plans/features/`
  # via `git mv` — the `subtypes` rule below is the ONLY reason its pages derive
  # `type: Mission` instead of falling through to the built-in `plans/features`
  # -> `Feature` table (data-model.md E-08 frozen datum; `plans/features/` did
  # not previously exist in the example, so WP04 created it fresh per that
  # datum's fallback instruction).
  - id: plans
    label: Plans
    order: 35
    type: Plan
    subtypes:
      - match: missions
        type: Mission

  - id: guides
    label: Guides
    order: 40
    type: Guide

  # ars-rethorica-example-01M204RR WP02 (FR-002/FR-003): custom showcase
  # section — a real Markua-authored conversion of Aristotle's Rhetoric Book I,
  # demonstrating the ADR-0004 *tolerated* custom-section path. Only the
  # top-level `rhetoric` folder is registered; `book-one/`, `book-two/`, and
  # `book-three/` nest automatically as Starlight sidebar sub-groups.
  - id: rhetoric
    label: Rhetoric
    order: 45
    type: Reference

  - id: presentations
    label: Presentations
    order: 50
    type: Presentation

  - id: glossary
    label: Reference          # glossary content lives in glossary/, shown as "Reference"
    order: 60
    type: Glossary

  - id: changelog
    label: Changelog
    order: 70
    type: Changelog
